<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI勉強会 | 社内イベント告知</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --card: #ffffff;
        --accent: #4f7dff;
        --text: #1a2b3c;
        --muted: #6b7a8f;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Plus Jakarta Sans", "Noto Sans JP", sans-serif;
        background: radial-gradient(circle at top, #fdfcff, var(--bg));
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
      }

      .poster {
        width: min(980px, 100%);
        background: var(--card);
        border-radius: 32px;
        box-shadow: 0 24px 60px rgba(33, 49, 77, 0.18);
        overflow: hidden;
      }

      .hero {
        position: relative;
        height: clamp(280px, 48vw, 420px);
        background-image: linear-gradient(135deg, rgba(79, 125, 255, 0.85), rgba(120, 196, 255, 0.6)),
          url("https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1400&q=80");
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: flex-end;
        padding: 32px 40px;
        color: #fff;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(26, 43, 60, 0.15) 0%, rgba(26, 43, 60, 0.65) 100%);
      }

      .hero-content {
        position: relative;
        z-index: 1;
        max-width: 520px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.22);
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .hero h1 {
        margin-top: 16px;
        font-size: clamp(2rem, 5vw, 3rem);
        line-height: 1.2;
      }

      .hero p {
        margin-top: 12px;
        font-size: 1rem;
        opacity: 0.92;
      }

      .details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        padding: 32px 40px 40px;
        background: linear-gradient(180deg, #ffffff 0%, #f8faff 100%);
      }

      .detail-card {
        background: #fff;
        border-radius: 20px;
        padding: 20px 24px;
        border: 1px solid rgba(79, 125, 255, 0.08);
        box-shadow: 0 12px 30px rgba(30, 54, 92, 0.08);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .detail-label {
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
      }

      .detail-value {
        font-size: 1.15rem;
        font-weight: 600;
      }

      .detail-sub {
        font-size: 0.95rem;
        color: var(--muted);
      }

      @media (max-width: 720px) {
        body {
          padding: 24px 16px;
        }

        .hero {
          padding: 28px 24px;
        }

        .details {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <section class="hero">
        <div class="hero-content">
          <span class="eyebrow">AI STUDY MEETUP</span>
          <h1>社内AI勉強会 2024</h1>
          <p>最新のAI活用事例を共有しながら、チームで学び合う1日。</p>
        </div>
      </section>
      <section class="details" aria-label="イベント詳細">
        <article class="detail-card">
          <span class="detail-label">Title</span>
          <span class="detail-value">AIで変わる業務デザイン</span>
          <span class="detail-sub">実践セッション &amp; 交流タイム</span>
        </article>
        <article class="detail-card">
          <span class="detail-label">Date &amp; Time</span>
          <span class="detail-value">2024年7月18日（木）</span>
          <span class="detail-sub">15:00 - 17:30</span>
        </article>
        <article class="detail-card">
          <span class="detail-label">Location</span>
          <span class="detail-value">Innovation Hall 3F</span>
          <span class="detail-sub">オンライン配信あり</span>
        </article>
      </section>
    </main>
  </body>
</html>
